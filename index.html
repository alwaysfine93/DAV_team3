<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공부호수 · 주간 공부 플래너</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f6fa;color:#18384c;font:16px/1.65 "Malgun Gothic",system-ui,sans-serif}
main{width:min(790px,94%);margin:24px auto 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:0 4px 16px}
header strong{font-size:23px}
#balance{font-weight:bold;color:#255671;background:white;border:1px solid #d3e1eb;padding:5px 15px;border-radius:40px}
.scene{position:relative;overflow:hidden;height:155px;padding:28px;border-radius:24px;background:linear-gradient(#bfd9e8,#dfebf1 65%,#abcdde 66%,#bfdbe4)}
.scene:before,.scene:after{content:"";position:absolute;right:-8%;width:74%;height:85%;bottom:30%;background:#8fb3c6;clip-path:polygon(0 100%,20% 60%,34% 70%,57% 12%,74% 46%,88% 22%,100% 66%,100% 100%)}
.scene:after{right:-13%;bottom:22%;background:#709aad;transform:scale(.85)}
h1{position:relative;z-index:1;font-size:clamp(25px,5vw,36px);margin:5px 0}
.scene small{position:relative;z-index:1;color:#2c5066}
nav{display:flex;margin:14px 0;background:#e0ebf2;border-radius:15px;padding:4px}
button,input,select{font:inherit}
button{border:0;border-radius:14px;padding:9px 17px;background:#245d81;color:white;cursor:pointer;font-weight:650}
button:hover{filter:brightness(.94)}
button:disabled{opacity:.65;cursor:not-allowed}
nav button{flex:1;background:transparent;color:#415c6c;padding:8px 0}
nav [aria-current=page]{background:white;color:#164c70;box-shadow:0 2px 7px #20465a18}
article{background:white;padding:clamp(17px,4vw,30px);border-radius:20px;margin:14px 0;border:1px solid #dae5ec}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:17px;margin:16px 0 6px}
p{margin:8px 0 15px}
label{display:block;font-size:14px;font-weight:650}
input,select{display:block;width:100%;min-width:0;border:1px solid #b4c8d4;background:#fbfdff;border-radius:10px;padding:8px 10px;color:inherit;margin:4px 0 12px}
.pair,.line{display:flex;gap:12px;align-items:center}
.pair>*{flex:1;min-width:0}
.line{justify-content:space-between}
.light{background:#e7f1f6;color:#204f6a}
.row{padding:11px 0;border-top:1px solid #e1ebf1;overflow-wrap:anywhere}
.muted,small{color:#4b6575}
.result{background:#edf5fa;padding:16px;border-radius:12px}
#warning{background:#fff0cf;padding:12px}
summary{cursor:pointer;font-weight:bold}
button:focus-visible,.product-photo:focus-visible{outline:3px solid #edaa44;outline-offset:3px}
section[hidden],[hidden]{display:none!important}

/* 공부 사진 선택 및 미리보기 */
#previewList{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin:8px 0 14px}
.preview-card{position:relative;margin:0;padding:6px;border:1px solid #d9e6ed;border-radius:12px;background:#fbfdff;overflow:hidden}
.preview-card img{display:block;width:100%;height:105px;object-fit:cover;border-radius:8px}
.preview-card figcaption{padding:4px 26px 0 2px;font-size:12px;color:#4b6575;overflow-wrap:anywhere}
.remove-photo{position:absolute;top:8px;right:8px;width:28px;height:28px;padding:0;border-radius:50%;background:#18384c;color:white;font-size:18px;line-height:1}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.photo-actions button{font-size:14px}

/* AI 관찰 결과 */
.analysis-box{margin:12px 0;padding:14px;border-radius:13px;background:#edf5fa;border:1px solid #d6e6ef}
.analysis-image{padding:10px 0;border-top:1px solid #d4e3ec}
.analysis-image:first-child{border-top:0}
.analysis-image p{margin:4px 0}
.analysis-pages{font-weight:700;color:#164c70}
#analysisStatus{padding:10px 12px;border-radius:10px;background:#f1f6fa}
#analysisStatus[data-kind="error"]{background:#fff0cf}
#analysisStatus[data-kind="ok"]{background:#e7f5eb}

/* 상품 카드 */
#goods{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}
.product-card{overflow:hidden;border:1px solid #d9e6ed;border-radius:17px;background:#fbfdff}
.product-photo{width:100%;height:150px;display:grid;place-items:center;border:0;border-radius:0;background:linear-gradient(145deg,#e6f3fa,#d4e8f1);color:#245d81;cursor:pointer}
.product-photo:hover{filter:brightness(.97)}
.product-emoji{font-size:76px;line-height:1;filter:drop-shadow(0 5px 5px #18384c22)}
.product-info{padding:13px}
.product-info h3{font-size:16px;line-height:1.45;margin:0 0 5px}
.product-price{margin:0 0 11px;color:#4b6575;font-weight:700}
.product-buy{width:100%}
.shop-help{font-size:14px;color:#4b6575}
@media(max-width:450px){
  main{margin-top:12px}
  .scene{height:125px;padding:16px}
  .line{gap:4px}
  .line button{padding:7px 12px}
  #goods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .product-photo{height:120px}
  .product-emoji{font-size:60px}
  .product-info{padding:10px}
  .product-info h3{font-size:14px}
  #previewList{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px}
  .preview-card img{height:85px}
}
</style>
</head>
<body><main>
<header><strong>◒ 공부호수</strong><span id="balance"></span></header>
<div class="scene"><small>주간 공부 플래너</small><h1 id="title">공부 계획</h1></div>
<p id="warning" role="alert" hidden></p>

<nav aria-label="기능 선택">
<button data-tab="plan">공부 계획</button>
<button data-tab="verify">사진 인증</button>
<button data-tab="reward">코인 지급</button>
<button data-tab="shop">코인 상점</button>
</nav>

<section id="plan">
  <article>
    <h2>계획 입력</h2>
    <form id="planner" novalidate>
      <div class="pair">
        <label>공부할 날짜<input type="date" id="date"></label>
        <label>과목<input id="subject" placeholder="예: 수학"></label>
      </div>
      <label>문제집 이름<input id="book" placeholder="예: 수학 익힘"></label>
      <div class="pair">
        <label>시작 쪽수<input id="start" placeholder="예: 12"></label>
        <label>마지막 쪽수<input id="end" placeholder="예: 15"></label>
      </div>
      <button type="submit" id="addPlan">계획 추가</button>
      <span id="planMsg" role="status"></span>
    </form>
  </article>

  <article>
    <h2>주간 계획</h2>
    <div class="line">
      <button class="light" id="prev" aria-label="지난주">‹</button>
      <strong id="range"></strong>
      <button class="light" id="next" aria-label="다음 주">›</button>
    </div>
    <div id="plans"></div>
  </article>
</section>

<section id="verify" hidden>
  <article>
    <h2>공부 인증하기</h2>
    <label>인증할 계획<select id="choice"></select></label>
    <label>오늘 공부한 내용<input id="statement" placeholder="예: 수학 익힘 10쪽부터 15쪽까지 공부"></label>
    <small id="example"></small>

    <label for="photo">공부한 사진 선택 (최대 6장)</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="photo-actions">
      <button type="button" class="light" id="addPhotos">사진 더 추가하기</button>
      <button type="button" class="light" id="clearPhotos">사진 모두 지우기</button>
    </div>
    <p id="photoCount" class="muted" aria-live="polite">선택한 사진이 없습니다.</p>
    <div id="previewList" aria-label="선택한 공부 사진 미리보기"></div>

    <p class="muted">계획이 10~15쪽이라면 10쪽과 15쪽이 사진에서 확인되면 인증할 수 있어요. 중간 쪽 사진은 필요하지 않습니다.</p>
    <button type="button" id="analyzePhotos">사진 분석 및 인증 확인</button>
    <p id="analysisStatus" role="status" aria-live="polite">사진을 선택한 뒤 분석 버튼을 눌러 주세요.</p>
    <div id="analysisResult" class="analysis-box" hidden></div>

    <button type="button" id="certify">코인 받기</button>
    <p id="certMsg" role="status"></p>
    <button type="button" class="light" data-go="reward">보상 확인 →</button>
  </article>
</section>

<section id="reward" hidden>
  <article>
    <h2>코인 지급</h2>
    <p class="result" id="earned"></p>
    <div id="history"></div>
    <button type="button" data-go="shop">상점으로 →</button>
  </article>
</section>

<section id="shop" hidden>
  <article>
    <h2>코인 상점</h2>
    <p class="shop-help">상품 사진이나 해당 상품의 구매 버튼을 눌러 코인으로 구매할 수 있어요.</p>
    <div id="goods"></div>
    <p id="shopMsg" role="status"></p>
    <details id="bag"><summary>소지 상품</summary><div id="items"></div></details>
    <p><button type="button" class="light" data-go="plan">공부 계획으로 →</button></p>
  </article>
</section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);

const goods = [
  {name:"로블록스 로벅스 100",price:7000,emoji:"🎮"},
  {name:"베라 기프티콘 (싱글킹)",price:9000,emoji:"🍦"},
  {name:"메가커피 쿠폰",price:7500,emoji:"☕"},
  {name:"CU 상품권 5,000원",price:12000,emoji:"🎁"}
];

const key = "studyLake.v1";
const initial = () => ({plans:[], coins:5000, purchases:[], attempts:[]});
let state = initial();
let blocked = false;

function warn(message){
  $("warning").hidden=false;
  $("warning").textContent=message;
}
function read(){
  const raw=localStorage.getItem(key);
  if(raw===null)return initial();
  const saved=JSON.parse(raw);
  if(!Array.isArray(saved.plans)||!Array.isArray(saved.purchases)||!Array.isArray(saved.attempts)||!Number.isSafeInteger(saved.coins))throw Error("invalid");
  return saved;
}
try{
  state=read();
  localStorage.setItem(key,JSON.stringify(state));
}catch{
  blocked=true;
  warn("저장 공간을 사용할 수 없거나 기록을 읽지 못했습니다. 브라우저의 저장 설정을 확인해 주세요.");
}

function change(fn){
  if(blocked)return false;
  try{
    const draft=read();
    fn(draft);
    localStorage.setItem(key,JSON.stringify(draft));
    state=draft;
    $("warning").hidden=true;
    return true;
  }catch{
    warn("변경 사항을 저장하지 못했습니다. 브라우저 저장 공간과 설정을 확인해 주세요.");
    return false;
  }
}
function localDate(d){
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
}
function shifted(d,n){
  const copy=new Date(d);
  copy.setDate(copy.getDate()+n);
  return copy;
}
function monday(d){
  return shifted(d,-((d.getDay()+6)%7));
}
let week=monday(new Date());
$("date").value=localDate(new Date());

const describe=p=>p.subject+" · "+p.book+" ("+p.start+"쪽 ~ "+p.end+"쪽)";
function row(parent,message){
  const div=document.createElement("div");
  div.className="row";
  div.textContent=message;
  parent.append(div);
  return div;
}

function renderGoods(){
  const container=$("goods");
  container.replaceChildren();

  goods.forEach((product,index)=>{
    const card=document.createElement("div");
    card.className="product-card";

    const photo=document.createElement("button");
    photo.type="button";
    photo.className="product-photo";
    photo.setAttribute("aria-label",product.name+" 그림. 눌러서 구매");
    photo.title=product.name+" 구매";

    const picture=document.createElement("span");
    picture.className="product-emoji";
    picture.setAttribute("aria-hidden","true");
    picture.textContent=product.emoji;
    photo.append(picture);
    photo.onclick=()=>purchaseProduct(index);

    const info=document.createElement("div");
    info.className="product-info";

    const name=document.createElement("h3");
    name.textContent=product.name;

    const price=document.createElement("p");
    price.className="product-price";
    price.textContent=product.price.toLocaleString("ko-KR")+" 코인";

    const buyButton=document.createElement("button");
    buyButton.type="button";
    buyButton.className="product-buy";
    buyButton.textContent="이 상품 구매";
    buyButton.onclick=()=>purchaseProduct(index);

    info.append(name,price,buyButton);
    card.append(photo,info);
    container.append(card);
  });
}

function render(){
  $("balance").textContent=state.coins.toLocaleString("ko-KR")+" 코인";

  const from=localDate(week),to=localDate(shifted(week,6));
  $("range").textContent=from+" ~ "+to.slice(5);
  $("plans").replaceChildren();

  const sorted=[...state.plans].sort((a,b)=>a.date.localeCompare(b.date));
  const visible=sorted.filter(p=>p.date>=from&&p.date<=to);
  if(!visible.length)row($("plans"),"이번 주에 등록한 계획이 없습니다.");

  for(const p of visible){
    const item=row($("plans"),p.date.slice(5)+" · "+describe(p)+" · "+(p.done?"인증 완료":"인증 대기"));
    item.id="plan-"+p.id;
  }

  const selected=$("choice").value;
  $("choice").replaceChildren(...sorted.filter(p=>!p.done).map(p=>new Option(p.date+" · "+describe(p),p.id)));
  if([...$("choice").options].some(o=>o.value===selected))$("choice").value=selected;
  if(!$("choice").length)$("choice").add(new Option("인증할 계획이 없습니다.",""));
  showExample();

  const complete=state.attempts.filter(a=>a.ok);
  const total=complete.reduce((sum,a)=>sum+(a.amount??1000),0);
  $("earned").textContent=complete.length
    ? (complete.at(-1).amount??1000).toLocaleString("ko-KR")+"코인 지급! · 누적 공부 보상 "+total.toLocaleString("ko-KR")+"코인"
    : "계획한 시작 쪽과 마지막 쪽이 사진에서 확인되면 1,000코인을 받습니다.";

  $("history").replaceChildren();
  for(const a of complete.slice().reverse()){
    const p=state.plans.find(p=>p.id===a.plan);
    if(p)row($("history"),p.date+" · "+describe(p)+" · +"+(a.amount??1000).toLocaleString("ko-KR")+"코인");
  }

  $("items").replaceChildren();
  if(!state.purchases.length)row($("items"),"아직 산 상품이 없습니다.");
  for(const p of state.purchases)row($("items"),p.name);
}

function go(id){
  document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!==id);
  document.querySelectorAll("[data-tab]").forEach(b=>{
    if(b.dataset.tab===id){
      b.setAttribute("aria-current","page");
      $("title").textContent=b.textContent;
    }else{
      b.removeAttribute("aria-current");
    }
  });
  render();
}
document.querySelectorAll("[data-tab],[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.tab||b.dataset.go));
$("prev").onclick=()=>{week=shifted(week,-7);render();};
$("next").onclick=()=>{week=shifted(week,7);render();};

function addPlan(e){
  e.preventDefault();
  const plan={id:globalThis.crypto?.randomUUID?.() ?? (Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)),done:false};

  for(const field of ["date","subject","book","start","end"]){
    plan[field]=$(field).value.trim();
    if(!plan[field]){
      $("planMsg").textContent=" 값을 꼭 입력하세요!";
      $(field).focus();
      return;
    }
  }

  const start=parsePageNumber(plan.start);
  const end=parsePageNumber(plan.end);
  if(start===null||end===null||start<1||end<start){
    $("planMsg").textContent="시작 쪽과 마지막 쪽은 1 이상의 숫자로 입력하고, 시작 쪽은 마지막 쪽보다 작거나 같아야 합니다.";
    $("start").focus();
    return;
  }

  $("planMsg").textContent="";
  if(change(s=>s.plans.push(plan))){
    week=monday(new Date(plan.date+"T12:00:00"));
    render();
    for(const id of ["book","start","end"])$(id).value="";
    $("planMsg").textContent=" 이 기기에 저장됨 · "+describe(plan);
    $("choice").value=plan.id;
    showExample();
    $("plan-"+plan.id)?.scrollIntoView?.({block:"nearest"});
  }else{
    $("planMsg").textContent=" 이 기기에 저장하지 못했습니다. 입력 내용은 그대로 남아 있습니다.";
  }
}
$("addPlan").onclick=addPlan;
$("planner").onsubmit=addPlan;

function parsePageNumber(value){
  const normalized=String(value).normalize("NFKC").trim();
  if(!/^[0-9]+$/.test(normalized))return null;
  const number=Number(normalized);
  return Number.isSafeInteger(number)?number:null;
}
function plannedPageRange(plan){
  const start=parsePageNumber(plan.start);
  const end=parsePageNumber(plan.end);
  if(start===null||end===null||start<1||end<start)return null;
  return {start,end};
}

/*
  계획한 모든 쪽이 아니라 시작 쪽과 끝 쪽만 확인합니다.
  예: 10~15쪽 계획이면 사진에서 10쪽과 15쪽이 읽히면 통과합니다.
*/
function comparePlannedPages(plan,analysis){
  const range=plannedPageRange(plan);
  if(!range){
    return {
      ok:false,
      reason:"계획의 시작 쪽과 마지막 쪽이 올바른 숫자인지 확인해 주세요.",
      missing:[]
    };
  }

  const observed=new Set(
    (Array.isArray(analysis?.observed_pages)?analysis.observed_pages:[])
      .filter(page=>Number.isInteger(page)&&page>0)
  );

  for(const item of Array.isArray(analysis?.images)?analysis.images:[]){
    for(const page of Array.isArray(item?.page_numbers)?item.page_numbers:[]){
      if(Number.isInteger(page)&&page>0)observed.add(page);
    }
  }

  const required=[...new Set([range.start,range.end])];
  const missing=required.filter(page=>!observed.has(page));

  return {
    ok:missing.length===0,
    start:range.start,
    end:range.end,
    required,
    observed:[...observed].sort((a,b)=>a-b),
    missing
  };
}

/* 사진 선택 및 미리보기 */
let selectedPhotos=[];
let previewUrls=[];
let lastAnalysis=null;
let lastAnalysisSignature="";

function selectedPhotoSignature(){
  return JSON.stringify(selectedPhotos.map(file=>({
    name:file.name,size:file.size,lastModified:file.lastModified
  })));
}
function clearAnalysis(){
  lastAnalysis=null;
  lastAnalysisSignature="";
  $("analysisResult").replaceChildren();
  $("analysisResult").hidden=true;
  $("analysisStatus").textContent="사진을 선택한 뒤 ‘사진 분석 및 인증 확인’을 눌러 주세요.";
  $("analysisStatus").dataset.kind="";
}
function setAnalysisStatus(message,kind=""){
  $("analysisStatus").textContent=message;
  $("analysisStatus").dataset.kind=kind;
}
function renderPhotoPreviews(){
  const container=$("previewList");
  container.replaceChildren();

  for(const url of previewUrls)URL.revokeObjectURL(url);
  previewUrls=[];

  $("photoCount").textContent=selectedPhotos.length
    ? selectedPhotos.length+"장의 사진을 선택했습니다. (최대 6장)"
    : "선택한 사진이 없습니다.";

  selectedPhotos.forEach((file,index)=>{
    const figure=document.createElement("figure");
    figure.className="preview-card";

    const image=document.createElement("img");
    const url=URL.createObjectURL(file);
    previewUrls.push(url);
    image.src=url;
    image.alt="선택한 공부 사진 "+(index+1);

    const caption=document.createElement("figcaption");
    caption.textContent=file.name;

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="remove-photo";
    remove.textContent="×";
    remove.setAttribute("aria-label",file.name+" 사진 삭제");
    remove.onclick=()=>{
      selectedPhotos.splice(index,1);
      renderPhotoPreviews();
      clearAnalysis();
      $("certMsg").textContent="";
    };

    figure.append(image,caption,remove);
    container.append(figure);
  });
}
function addPhotoFiles(fileList){
  const incoming=Array.from(fileList||[]);
  const supported=incoming.filter(file=>
    ["image/jpeg","image/png","image/webp"].includes(file.type)
  );

  if(supported.length!==incoming.length){
    setAnalysisStatus("JPG, PNG, WebP 사진만 사용할 수 있어요. 지원하지 않는 파일은 제외했습니다.","error");
  }

  for(const file of supported){
    const duplicate=selectedPhotos.some(existing=>
      existing.name===file.name&&
      existing.size===file.size&&
      existing.lastModified===file.lastModified
    );
    if(!duplicate)selectedPhotos.push(file);
  }

  if(selectedPhotos.length>6){
    selectedPhotos=selectedPhotos.slice(0,6);
    setAnalysisStatus("AI 분석은 최대 6장까지 지원해요. 앞에서부터 6장만 선택했습니다.","error");
  }

  renderPhotoPreviews();
  clearAnalysis();
  $("certMsg").textContent="";
}

/* 브라우저에서 사진을 JPEG로 줄여 서버 크기 제한에 맞춥니다. */
function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const image=new Image();
    image.onload=()=>{URL.revokeObjectURL(url);resolve(image);};
    image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("사진 파일을 열지 못했습니다."));};
    image.src=url;
  });
}
function canvasToBlob(canvas,type,quality){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("사진을 변환하지 못했습니다.")),type,quality);
  });
}
function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("사진을 읽지 못했습니다."));
    reader.readAsDataURL(blob);
  });
}
async function imageToDataUrl(file){
  const image=await loadImage(file);
  const maxSide=1800;
  const scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
  canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
  const context=canvas.getContext("2d");
  if(!context)throw new Error("사진 변환을 시작하지 못했습니다.");
  context.drawImage(image,0,0,canvas.width,canvas.height);

  let quality=0.82;
  let blob=await canvasToBlob(canvas,"image/jpeg",quality);
  while(blob.size>390_000&&quality>0.4){
    quality-=0.1;
    blob=await canvasToBlob(canvas,"image/jpeg",quality);
  }
  if(blob.size>400_000)throw new Error("사진 용량을 줄이지 못했습니다. 더 작은 사진을 사용해 주세요.");
  return await blobToDataUrl(blob);
}

async function analyzeSelectedPhotos(){
  const plan=state.plans.find(p=>p.id===$("choice").value);
  if(!plan){
    setAnalysisStatus("먼저 인증할 계획을 선택해 주세요.","error");
    return;
  }
  if(selectedPhotos.length<1){
    setAnalysisStatus("먼저 사진을 한 장 이상 선택해 주세요.","error");
    return;
  }
  if(selectedPhotos.length>6){
    setAnalysisStatus("한 번에 분석할 수 있는 사진은 최대 6장입니다.","error");
    return;
  }

  const button=$("analyzePhotos");
  button.disabled=true;
  button.textContent="사진을 분석하고 있어요…";
  $("certify").disabled=true;
  $("analysisResult").hidden=true;
  $("analysisResult").replaceChildren();
  setAnalysisStatus("사진을 준비하고 시작 쪽과 끝 쪽을 확인하는 중입니다.");

  try{
    const signature=selectedPhotoSignature();
    const images=[];
    for(const file of selectedPhotos){
      images.push({dataUrl:await imageToDataUrl(file)});
    }

    const response=await fetch("/api/analyze-images",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({images})
    });

    let data;
    try{
      data=await response.json();
    }catch{
      throw new Error("서버 응답을 읽지 못했습니다. Vercel 배포 경로를 확인해 주세요.");
    }

    if(!response.ok||!data?.ok){
      throw new Error(data?.error||"사진 분석에 실패했습니다.");
    }
    if(!data.analysis||!Array.isArray(data.analysis.images)){
      throw new Error("분석 결과 형식이 올바르지 않습니다.");
    }

    lastAnalysis=data.analysis;
    lastAnalysisSignature=signature;
    renderAnalysis(data.analysis,plan);
  }catch(error){
    lastAnalysis=null;
    lastAnalysisSignature="";
    setAnalysisStatus(error?.message||"사진 분석 중 오류가 발생했습니다.","error");
  }finally{
    button.disabled=false;
    button.textContent="사진 분석 및 인증 확인";
    $("certify").disabled=false;
  }
}

function renderAnalysis(analysis,plan){
  const container=$("analysisResult");
  container.replaceChildren();

  const heading=document.createElement("h3");
  heading.textContent="AI 사진 쪽수 확인";
  container.append(heading);

  const comparison=comparePlannedPages(plan,analysis);
  const summary=document.createElement("p");
  summary.className="analysis-pages";
  summary.textContent=comparison.ok
    ?"시작 쪽 "+comparison.start+"쪽과 끝 쪽 "+comparison.end+"쪽이 사진에서 확인됐습니다."
    :"시작 쪽과 끝 쪽을 모두 확인하지 못했습니다.";
  container.append(summary);

  if(comparison.missing.length){
    const missing=document.createElement("p");
    missing.textContent="사진에서 확인되지 않은 쪽: "+comparison.missing.join("쪽, ")+"쪽";
    container.append(missing);
  }

  const observed=document.createElement("p");
  observed.textContent=comparison.observed.length
    ?"사진에서 확인한 쪽수: "+comparison.observed.join(", ")+"쪽"
    :"사진에서 읽힌 쪽수가 없습니다.";
  container.append(observed);

  const note=document.createElement("p");
  note.className="muted";
  note.textContent="중간 쪽은 인증에 필요하지 않습니다. 시작 쪽과 끝 쪽 번호가 사진에서 잘 보이도록 촬영해 주세요.";
  container.append(note);

  analysis.images.forEach(item=>{
    const block=document.createElement("div");
    block.className="analysis-image";

    const title=document.createElement("strong");
    title.textContent="사진 "+item.image_index;
    block.append(title);

    const pages=document.createElement("p");
    pages.className="analysis-pages";
    pages.textContent=item.page_numbers?.length
      ?"읽힌 쪽수: "+item.page_numbers.join(", ")+"쪽"
      :"읽힌 쪽수: 확인되지 않음";
    block.append(pages);

    const details=[];
    if(item.subject)details.push("과목: "+item.subject);
    if(item.book_title)details.push("책 제목: "+item.book_title);
    if(details.length){
      const detail=document.createElement("p");
      detail.textContent=details.join(" · ");
      block.append(detail);
    }

    const workText={
      present:"풀이·필기·답안 표시가 보임",
      not_visible:"풀이·필기·답안 표시가 보이지 않음",
      uncertain:"공부 흔적을 확인하기 어려움"
    };
    const work=document.createElement("p");
    work.textContent="보이는 흔적: "+(workText[item.visible_work]||"확인하기 어려움");
    block.append(work);

    if(item.observations){
      const observation=document.createElement("p");
      observation.textContent=item.observations;
      block.append(observation);
    }
    if(item.unreadable?.length){
      const unreadable=document.createElement("p");
      unreadable.className="muted";
      unreadable.textContent="읽기 어려운 점: "+item.unreadable.join(" · ");
      block.append(unreadable);
    }
    container.append(block);
  });

  container.hidden=false;
  if(comparison.ok){
    setAnalysisStatus("시작 쪽과 끝 쪽이 사진에서 확인됐습니다. 중간 쪽 사진은 필요하지 않아요. ‘코인 받기’를 눌러 인증하세요.","ok");
  }else{
    setAnalysisStatus("시작 쪽과 끝 쪽 중 사진에서 확인되지 않은 쪽이 있습니다. 해당 쪽이 보이는 사진을 추가한 뒤 다시 분석해 주세요.","error");
  }
}
$("analyzePhotos").onclick=analyzeSelectedPhotos;

function showExample(){
  const plan=state.plans.find(p=>p.id===$("choice").value);
  $("statement").placeholder=plan
    ? plan.subject+" · "+plan.book+" · "+plan.start+"~"+plan.end+"쪽"
    : "인증할 계획을 선택하세요";
  $("example").textContent=plan
    ? "계획한 시작 쪽 "+plan.start+"쪽과 끝 쪽 "+plan.end+"쪽이 사진에서 확인되어야 합니다. 중간 쪽은 필요하지 않아요."
    : "";
}

  clearAnalysis();
  showExample();
};

$("certify").onclick=()=>{
  const id=$("choice").value;
  const plan=state.plans.find(p=>p.id===id);
  const files=selectedPhotos.filter(file=>
    ["image/jpeg","image/png","image/webp"].includes(file.type)
  );

  if(!plan){
    $("certMsg").textContent="먼저 인증할 계획을 선택하세요.";
    return;
  }
  if(!files.length){
    $("certMsg").textContent="공부한 사진을 한 장 이상 선택하세요.";
    return;
  }
  if(files.length>6){
    $("certMsg").textContent="사진은 한 번에 최대 6장까지 인증할 수 있습니다.";
    return;
  }
  if(!lastAnalysis||lastAnalysisSignature!==selectedPhotoSignature()){
    $("certMsg").textContent="현재 선택한 사진을 먼저 분석해 주세요.";
    return;
  }

  const comparison=comparePlannedPages(plan,lastAnalysis);
  if(!comparison.ok){
    $("certMsg").textContent=comparison.missing.length
      ?"시작 쪽과 끝 쪽을 모두 사진에서 확인해야 합니다. 확인되지 않은 쪽: "+comparison.missing.join(", ")+"쪽"
      :"계획의 시작 쪽과 마지막 쪽을 숫자로 입력했는지 확인해 주세요.";
    return;
  }

  let message="";
  if(change(s=>{
    const current=s.plans.find(p=>p.id===id);
    if(!current||current.done){
      message="이미 처리된 계획입니다.";
      return;
    }

    const currentComparison=comparePlannedPages(current,lastAnalysis);
    if(!currentComparison.ok){
      message="계획한 시작 쪽과 끝 쪽이 사진에서 확인되지 않아 인증하지 못했습니다.";
      return;
    }

    s.attempts.push({
      plan:id,
      statement:$("statement").value.trim(),
      filenames:files.map(file=>file.name),
      filename:files.map(file=>file.name).join(", "),
      photoCount:files.length,
      observedPages:currentComparison.observed,
      requiredPages:currentComparison.required,
      plannedStart:currentComparison.start,
      plannedEnd:currentComparison.end,
      time:new Date().toISOString(),
      ok:true,
      amount:1000
    });

    current.done=true;
    s.coins+=1000;
    message="시작 쪽 "+currentComparison.start+"쪽과 끝 쪽 "+currentComparison.end+"쪽이 확인되어 인증됐습니다! 1,000코인 지급!";
  })){
    if(state.plans.find(p=>p.id===id)?.done){
      $("statement").value="";
      clearSelectedPhotos();
      $("certMsg").textContent=message;
    }else{
      $("certMsg").textContent=message||"인증 내용을 저장하지 못했습니다.";
    }
    render();
  }
};

function purchaseProduct(index){
  const product=goods[index];
  if(!product)return;

  let result;
  if(change(s=>{
    if(s.coins<product.price){
      result="코인이 부족합니다. 필요한 코인: "+product.price.toLocaleString("ko-KR")+"코인";
      return;
    }
    s.coins-=product.price;
    s.purchases.push({
      name:product.name,
      price:product.price,
      time:new Date().toISOString()
    });
    result=product.name+"을(를) 구매했어요! 남은 코인: "+s.coins.toLocaleString("ko-KR")+"코인";
  })){
    $("shopMsg").textContent=result;
    render();
  }
}

      render();
    }catch{

  }
